<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | UMAMTEK</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 78px);
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .auth-card {
            width: min(460px, 100%);
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.08);
        }

        .auth-logo {
            text-align: center;
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 28px;
        }

        .auth-logo span {
            color: #f5c400;
        }

        .auth-card h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .auth-field {
            margin-bottom: 18px;
        }

        .auth-field label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .auth-field input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            outline: none;
        }

        .auth-field input:focus {
            border-color: #f5c400;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 17px;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
            color: #555555;
            font-size: 12px;
            font-weight: 700;
        }

        .auth-btn {
            width: 100%;
            margin-top: 5px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
            color: #999999;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #eeeeee;
            flex: 1;
        }

        .signup-link {
            text-align: center;
            font-size: 13px;
            color: #666666;
        }

        .signup-link a {
            color: #111111;
            font-weight: 900;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #777777;
        }

        .auth-message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="container nav-inner">

        <a href="index.html" class="logo">
            <span>UMA</span>MTEK
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </nav>

        <div class="nav-actions">
            <a href="signup.html" class="primary-btn small-btn">
                Sign Up
            </a>
        </div>

        <button class="menu-btn" id="menuBtn">
            ☰
        </button>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <span>UMA</span>MTEK
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to manage your bookings.
        </p>

        <div id="authMessage" class="auth-message"></div>


        <form id="loginForm">

            <div class="auth-field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword">
                        👁
                    </button>

                </div>

            </div>


            <a href="#" class="forgot" id="forgotPassword">
                Forgot Password?
            </a>


            <button
                type="submit"
                class="primary-btn auth-btn">

                Login →

            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <p class="signup-link">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>


        <a href="index.html" class="back-home">
            ← Back to UMAMTEK
        </a>

    </div>

</main>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const password =
        document.getElementById("password");

    const showPassword =
        document.getElementById("showPassword");

    showPassword.addEventListener("click", function () {

        if (password.type === "password") {

            password.type = "text";
            showPassword.textContent = "🙈";

        } else {

            password.type = "password";
            showPassword.textContent = "👁";

        }

    });


    document.getElementById("loginForm")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            /*
               Firebase Authentication will be connected here.

               Future flow:

               Email + Password
                    ↓
               Firebase Authentication
                    ↓
               Customer Account
                    ↓
               Customer Dashboard
            */

            showMessage(
                "Firebase authentication will be connected in the next phase.",
                "info"
            );

        });


    document.getElementById("forgotPassword")
        .addEventListener("click", function (event) {

            event.preventDefault();

            showMessage(
                "Password recovery will be connected with Firebase.",
                "info"
            );

        });


    function showMessage(message, type) {

        const box =
            document.getElementById("authMessage");

        box.textContent = message;
        box.style.display = "block";

    }

});

</script>

</body>
</html>
