<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login / Signup | UMAMTEK</title>

<link rel="icon" href="logo.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
  min-height:100vh;
}

.header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #eee;
  background:#fff;
}

.header img{
  width:145px;
  max-height:55px;
  object-fit:contain;
}

.container{
  width:100%;
  max-width:470px;
  margin:35px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border:1px solid #e8e8e8;
  border-radius:22px;
  padding:28px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo-small{
  text-align:center;
  margin-bottom:15px;
}

.logo-small img{
  width:100px;
}

h1{
  text-align:center;
  font-size:27px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  font-size:14px;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  background:#f3f3f3;
  border-radius:12px;
  padding:4px;
  margin-bottom:25px;
}

.tab{
  flex:1;
  border:0;
  padding:12px;
  border-radius:9px;
  cursor:pointer;
  background:transparent;
  font-weight:700;
}

.tab.active{
  background:#ffd400;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

label{
  display:block;
  margin:14px 0 7px;
  font-size:14px;
  font-weight:700;
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid #d7d7d7;
  border-radius:10px;
  outline:none;
  font-size:15px;
  background:#fff;
}

input:focus{
  border-color:#111;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:48px;
}

.password-toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  cursor:pointer;
  font-size:21px;
  width:30px;
  height:30px;
}

.password-toggle.hidden-eye::after{
  content:"🙈";
}

.password-toggle.visible-eye::after{
  content:"👁️";
}

.phone-box{
  display:flex;
  gap:8px;
}

.country{
  width:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #d7d7d7;
  border-radius:10px;
  font-weight:bold;
  background:#f8f8f8;
}

.phone-box input{
  flex:1;
}

.btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:11px;
  margin-top:20px;
  cursor:pointer;
  font-size:15px;
  font-weight:800;
}

.btn-primary{
  background:#ffd400;
  color:#111;
}

.btn-primary:hover{
  background:#f1c600;
}

.btn-black{
  background:#111;
  color:#fff;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.forgot{
  text-align:right;
  margin-top:10px;
}

.forgot button{
  border:0;
  background:none;
  color:#555;
  cursor:pointer;
  font-size:13px;
  text-decoration:underline;
}

.otp-box{
  display:none;
  margin-top:18px;
  padding:16px;
  background:#fffbea;
  border:1px solid #f0d900;
  border-radius:12px;
}

.otp-box.show{
  display:block;
}

.otp-title{
  font-weight:800;
  margin-bottom:8px;
}

.timer{
  text-align:center;
  margin-top:8px;
  color:#666;
  font-size:13px;
}

.resend{
  text-align:center;
  margin-top:7px;
}

.resend button{
  border:0;
  background:none;
  text-decoration:underline;
  cursor:pointer;
  font-weight:bold;
}

.recaptcha-wrap{
  margin-top:18px;
  overflow:hidden;
}

.message{
  display:none;
  padding:11px;
  border-radius:9px;
  margin-top:15px;
  font-size:14px;
}

.message.show{
  display:block;
}

.message.error{
  background:#ffe8e8;
  color:#a40000;
}

.message.success{
  background:#e7ffe9;
  color:#08751b;
}

.back-home{
  text-align:center;
  margin-top:20px;
}

.back-home a{
  color:#111;
  font-weight:bold;
  text-decoration:none;
}

.footer{
  text-align:center;
  margin-top:25px;
  font-size:12px;
  color:#777;
}

@media(max-width:480px){
  .card{
    padding:21px;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header class="header">
  <img src="logo.png" alt="UMAMTEK">
</header>

<div class="container">

<div class="card">

<div class="logo-small">
  <img src="logo.png" alt="UMAMTEK Logo">
</div>

<h1>Welcome to UMAMTEK</h1>

<p class="subtitle">
  Book trusted professionals at your doorstep.
</p>

<div class="tabs">

<button class="tab active" id="loginTab" onclick="showSection('login')">
  Login
</button>

<button class="tab" id="signupTab" onclick="showSection('signup')">
  Create Account
</button>

</div>


<!-- ================= LOGIN ================= -->

<div id="loginSection" class="section active">

<form id="loginForm">

<label>Mobile Number or Email</label>

<input
  type="text"
  id="loginIdentity"
  placeholder="Enter mobile number or email"
  autocomplete="username"
  required
>

<label>Password</label>

<div class="password-box">

<input
  type="password"
  id="loginPassword"
  placeholder="Enter password"
  autocomplete="current-password"
  required
>

<button
  type="button"
  class="password-toggle hidden-eye"
  onclick="togglePassword('loginPassword',this)"
></button>

</div>

<div class="forgot">
<button type="button" onclick="openForgotPassword()">
  Forgot Password?
</button>
</div>

<button class="btn btn-primary" type="submit">
  Login
</button>

</form>

</div>


<!-- ================= SIGNUP ================= -->

<div id="signupSection" class="section">

<form id="signupForm">

<label>Full Name</label>

<input
  type="text"
  id="signupName"
  placeholder="Enter your full name"
  required
>

<label>Email Address</label>

<input
  type="email"
  id="signupEmail"
  placeholder="Enter your email"
  autocomplete="email"
  required
>

<label>Mobile Number</label>

<div class="phone-box">

<div class="country">+91</div>

<input
  type="tel"
  id="signupPhone"
  placeholder="10 digit mobile number"
  maxlength="10"
  inputmode="numeric"
  required
>

</div>

<label>Password</label>

<div class="password-box">

<input
  type="password"
  id="signupPassword"
  placeholder="Create password"
  autocomplete="new-password"
  required
>

<button
  type="button"
  class="password-toggle hidden-eye"
  onclick="togglePassword('signupPassword',this)"
></button>

</div>

<label>Confirm Password</label>

<div class="password-box">

<input
  type="password"
  id="signupConfirmPassword"
  placeholder="Confirm password"
  autocomplete="new-password"
  required
>

<button
  type="button"
  class="password-toggle hidden-eye"
  onclick="togglePassword('signupConfirmPassword',this)"
></button>

</div>

<!-- CAPTCHA -->

<div class="recaptcha-wrap">
  <div id="signup-recaptcha"></div>
</div>

<button
  class="btn btn-primary"
  id="sendSignupOtpBtn"
  type="submit"
>
  Verify Mobile & Create Account
</button>

</form>


<!-- SIGNUP OTP -->

<div id="signupOtpBox" class="otp-box">

<div class="otp-title">
  📱 Enter Mobile OTP
</div>

<p style="font-size:13px;color:#666;">
  A 6-digit OTP has been sent to your mobile number.
</p>

<label>OTP</label>

<input
  type="text"
  id="signupOtp"
  maxlength="6"
  inputmode="numeric"
  placeholder="Enter 6-digit OTP"
>

<button
  class="btn btn-black"
  onclick="verifySignupOtp()"
>
  Verify OTP & Create Account
</button>

<div class="timer" id="signupTimer"></div>

</div>

</div>


<!-- ================= FORGOT PASSWORD ================= -->

<div id="forgotSection" class="section">

<h2 style="font-size:21px;margin-bottom:8px;">
  Reset Password
</h2>

<p style="font-size:14px;color:#666;margin-bottom:18px;">
  Enter your registered mobile number. We will verify it with OTP.
</p>

<label>Registered Mobile Number</label>

<div class="phone-box">

<div class="country">+91</div>

<input
  type="tel"
  id="forgotPhone"
  maxlength="10"
  inputmode="numeric"
  placeholder="10 digit mobile number"
>

</div>

<div class="recaptcha-wrap">
  <div id="forgot-recaptcha"></div>
</div>

<button
  class="btn btn-primary"
  onclick="sendForgotOtp()"
>
  Send OTP
</button>


<div id="forgotOtpBox" class="otp-box">

<label>Enter OTP</label>

<input
  type="text"
  id="forgotOtp"
  maxlength="6"
  inputmode="numeric"
  placeholder="6-digit OTP"
>

<label>New Password</label>

<div class="password-box">

<input
  type="password"
  id="newPassword"
  placeholder="Create new password"
>

<button
  type="button"
  class="password-toggle hidden-eye"
  onclick="togglePassword('newPassword',this)"
></button>

</div>

<label>Confirm New Password</label>

<div class="password-box">

<input
  type="password"
  id="confirmNewPassword"
  placeholder="Confirm new password"
>

<button
  type="button"
  class="password-toggle hidden-eye"
  onclick="togglePassword('confirmNewPassword',this)"
></button>

</div>

<button
  class="btn btn-black"
  onclick="resetPassword()"
>
  Verify OTP & Reset Password
</button>

</div>

<div class="back-home">
<button
  onclick="showSection('login')"
  style="border:0;background:none;cursor:pointer;font-weight:bold;"
>
  ← Back to Login
</button>
</div>

</div>


<div id="message" class="message"></div>

</div>

<div class="footer">
  © UMAMTEK — Your Project, Our Priority
</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updatePassword,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  query,
  where,
  getDocs,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


/* ==========================================
   FIREBASE
========================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyCU-5U3KL85H7LRsHg9ck-KXo9RuTKqd68",

  authDomain:
  "umamtek-2cc57.firebaseapp.com",

  projectId:
  "umamtek-2cc57",

  storageBucket:
  "umamtek-2cc57.firebasestorage.app",

  messagingSenderId:
  "868603171659",

  appId:
  "1:868603171659:web:087f9df552ed09f354cece",

  measurementId:
  "G-KFYVWYS2TL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ==========================================
   GLOBAL VARIABLES
========================================== */

let signupConfirmationResult = null;
let forgotConfirmationResult = null;

let signupRecaptcha = null;
let forgotRecaptcha = null;

let signupTimerInterval = null;
let forgotTimerInterval = null;


/* ==========================================
   HELPERS
========================================== */

function cleanPhone(phone){

  return String(phone || "")
    .replace(/\D/g,"")
    .slice(-10);

}


function formatIndianPhone(phone){

  const clean = cleanPhone(phone);

  if(clean.length !== 10){
    throw new Error("Please enter a valid 10 digit mobile number.");
  }

  return "+91" + clean;

}


function showMessage(text,type="error"){

  const box = document.getElementById("message");

  box.textContent = text;

  box.className =
    "message show " + type;

}


function clearMessage(){

  const box = document.getElementById("message");

  box.className = "message";

  box.textContent = "";

}


/* ==========================================
   PASSWORD SHOW / HIDE
========================================== */

window.togglePassword = function(id,button){

  const input = document.getElementById(id);

  if(input.type === "password"){

    input.type = "text";

    button.classList.remove("hidden-eye");

    button.classList.add("visible-eye");

  }else{

    input.type = "password";

    button.classList.remove("visible-eye");

    button.classList.add("hidden-eye");

  }

};


/* ==========================================
   SECTIONS
========================================== */

window.showSection = function(section){

  clearMessage();

  document.querySelectorAll(".section")
    .forEach(x => x.classList.remove("active"));

  document.querySelectorAll(".tab")
    .forEach(x => x.classList.remove("active"));

  if(section === "login"){

    document
      .getElementById("loginSection")
      .classList.add("active");

    document
      .getElementById("loginTab")
      .classList.add("active");

  }

  if(section === "signup"){

    document
      .getElementById("signupSection")
      .classList.add("active");

    document
      .getElementById("signupTab")
      .classList.add("active");

  }

  if(section === "forgot"){

    document
      .getElementById("forgotSection")
      .classList.add("active");

  }

};


/* ==========================================
   CAPTCHA
========================================== */

function createSignupRecaptcha(){

  if(signupRecaptcha){

    try{
      signupRecaptcha.clear();
    }catch(e){}

  }

  signupRecaptcha =
    new RecaptchaVerifier(
      auth,
      "signup-recaptcha",
      {
        size:"normal"
      }
    );

  return signupRecaptcha;

}


function createForgotRecaptcha(){

  if(forgotRecaptcha){

    try{
      forgotRecaptcha.clear();
    }catch(e){}

  }

  forgotRecaptcha =
    new RecaptchaVerifier(
      auth,
      "forgot-recaptcha",
      {
        size:"normal"
      }
    );

  return forgotRecaptcha;

}


/* ==========================================
   SIGNUP — SEND OTP
========================================== */

document
.getElementById("signupForm")
.addEventListener("submit",async function(e){

  e.preventDefault();

  clearMessage();

  const name =
    document.getElementById("signupName")
    .value.trim();

  const email =
    document.getElementById("signupEmail")
    .value.trim()
    .toLowerCase();

  const phone =
    cleanPhone(
      document.getElementById("signupPhone")
      .value
    );

  const password =
    document.getElementById("signupPassword")
    .value;

  const confirmPassword =
    document.getElementById("signupConfirmPassword")
    .value;


  if(!name || !email || !phone ||
     !password || !confirmPassword){

    showMessage("Please fill all signup details.");

    return;
  }


  if(phone.length !== 10){

    showMessage("Please enter a valid 10 digit mobile number.");

    return;
  }


  if(password.length < 6){

    showMessage(
      "Password must contain at least 6 characters."
    );

    return;
  }


  if(password !== confirmPassword){

    showMessage("Passwords do not match.");

    return;
  }


  const btn =
    document.getElementById("sendSignupOtpBtn");

  btn.disabled = true;

  btn.textContent = "Sending OTP...";


  try{

    /* Check email first */

    try{

      /*
       We don't create the account yet.
       Firebase will reject duplicate email
       when account creation happens.
      */

    }catch(e){}


    const verifier =
      createSignupRecaptcha();

    signupConfirmationResult =
      await signInWithPhoneNumber(
        auth,
        formatIndianPhone(phone),
        verifier
      );


    sessionStorage.setItem(
      "umamtekSignupName",
      name
    );

    sessionStorage.setItem(
      "umamtekSignupEmail",
      email
    );

    sessionStorage.setItem(
      "umamtekSignupPhone",
      phone
    );

    sessionStorage.setItem(
      "umamtekSignupPassword",
      password
    );


    document
      .getElementById("signupOtpBox")
      .classList.add("show");


    showMessage(
      "OTP sent successfully to your mobile.",
      "success"
    );

    startTimer(
      "signupTimer",
      60
    );


  }catch(error){

    console.error(error);

    showMessage(
      firebaseError(error)
    );

    btn.disabled = false;

    btn.textContent =
      "Verify Mobile & Create Account";

  }

});


/* ==========================================
   SIGNUP — VERIFY OTP
========================================== */

window.verifySignupOtp = async function(){

  clearMessage();

  const otp =
    document.getElementById("signupOtp")
    .value.trim();

  if(!otp || otp.length !== 6){

    showMessage("Enter the 6 digit OTP.");

    return;
  }

  if(!signupConfirmationResult){

    showMessage("Please request OTP first.");

    return;
  }


  try{

    showMessage(
      "Verifying OTP...",
      "success"
    );


    /*
      Phone OTP verifies the mobile.
      We then create the customer's
      email/password Firebase account.
    */

    await signupConfirmationResult.confirm(otp);


    /*
      The OTP sign-in creates a temporary
      phone-auth user.

      We sign that user out and create the
      permanent email/password account.
    */

    await signOut(auth);


    const name =
      sessionStorage.getItem(
        "umamtekSignupName"
      );

    const email =
      sessionStorage.getItem(
        "umamtekSignupEmail"
      );

    const phone =
      sessionStorage.getItem(
        "umamtekSignupPhone"
      );

    const password =
      sessionStorage.getItem(
        "umamtekSignupPassword"
      );


    /*
      Create permanent email/password account.
    */

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      credential.user;


    const customerId =
      "UMT-CUSTOMER-" +
      user.uid
      .replace(/[^a-zA-Z0-9]/g,"")
      .slice(0,8)
      .toUpperCase();


    await setDoc(
      doc(db,"users",user.uid),
      {

        uid:user.uid,

        customerId:customerId,

        name:name,

        email:email,

        phone:phone,

        role:"customer",

        phoneVerified:true,

        accountStatus:"active",

        createdAt:serverTimestamp(),

        updatedAt:serverTimestamp()

      }
    );


    localStorage.setItem(
      "umamtekLoggedIn",
      "true"
    );

    localStorage.setItem(
      "umamtekUser",
      name
    );

    localStorage.setItem(
      "umamtekPhone",
      phone
    );

    localStorage.setItem(
      "umamtekRole",
      "customer"
    );


    sessionStorage.clear();


    alert(
      "🎉 UMAMTEK account created successfully!"
    );


    window.location.href =
      "profile.html";


  }catch(error){

    console.error(error);

    showMessage(
      firebaseError(error)
    );

  }

};


/* ==========================================
   LOGIN
========================================== */

document
.getElementById("loginForm")
.addEventListener("submit",async function(e){

  e.preventDefault();

  clearMessage();

  const identity =
    document.getElementById("loginIdentity")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;


  if(!identity || !password){

    showMessage(
      "Please enter your mobile/email and password."
    );

    return;
  }


  try{

    let email = identity;


    /*
      Email login
    */

    if(!identity.includes("@")){

      /*
        Mobile login requires a controlled
        phone -> email lookup.
      */

      const phone =
        cleanPhone(identity);


      if(phone.length !== 10){

        showMessage(
          "Please enter a valid mobile number or email."
        );

        return;
      }


      const q =
        query(
          collection(db,"phoneIndex"),
          where("phone","==",phone)
        );


      const snapshot =
        await getDocs(q);


      if(snapshot.empty){

        showMessage(
          "Account not found. Please signup first."
        );

        return;
      }


      email =
        snapshot.docs[0].data().email;

    }


    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      credential.user;


    const profileSnap =
      await getDoc(
        doc(db,"users",user.uid)
      );


    if(!profileSnap.exists()){

      showMessage(
        "Customer profile not found."
      );

      await signOut(auth);

      return;
    }


    const profile =
      profileSnap.data();


    localStorage.setItem(
      "umamtekLoggedIn",
      "true"
    );

    localStorage.setItem(
      "umamtekUser",
      profile.name || "Customer"
    );

    localStorage.setItem(
      "umamtekPhone",
      profile.phone || ""
    );

    localStorage.setItem(
      "umamtekRole",
      "customer"
    );


    window.location.href =
      "profile.html";


  }catch(error){

    console.error(error);

    showMessage(
      firebaseError(error)
    );

  }

});


/* ==========================================
   FORGOT PASSWORD
========================================== */

window.openForgotPassword = function(){

  clearMessage();

  showSection("forgot");

};


window.sendForgotOtp = async function(){

  clearMessage();

  const phone =
    cleanPhone(
      document.getElementById("forgotPhone")
      .value
    );


  if(phone.length !== 10){

    showMessage(
      "Enter your registered 10 digit mobile number."
    );

    return;
  }


  try{

    /*
      First check whether phone exists.
    */

    const q =
      query(
        collection(db,"phoneIndex"),
        where("phone","==",phone)
      );


    const snapshot =
      await getDocs(q);


    if(snapshot.empty){

      showMessage(
        "No UMAMTEK account is registered with this number."
      );

      return;
    }


    const verifier =
      createForgotRecaptcha();


    forgotConfirmationResult =
      await signInWithPhoneNumber(
        auth,
        formatIndianPhone(phone),
        verifier
      );


    document
      .getElementById("forgotOtpBox")
      .classList.add("show");


    showMessage(
      "OTP sent successfully.",
      "success"
    );


    startTimer(
      "forgotTimer",
      60
    );


  }catch(error){

    console.error(error);

    showMessage(
      firebaseError(error)
    );

  }

};


/* ==========================================
   RESET PASSWORD
========================================== */

window.resetPassword = async function(){

  clearMessage();

  const otp =
    document.getElementById("forgotOtp")
    .value.trim();

  const newPassword =
    document.getElementById("newPassword")
    .value;

  const confirmPassword =
    document.getElementById("confirmNewPassword")
    .value;


  if(!otp || otp.length !== 6){

    showMessage("Enter the 6 digit OTP.");

    return;
  }


  if(newPassword.length < 6){

    showMessage(
      "New password must contain at least 6 characters."
    );

    return;
  }


  if(newPassword !== confirmPassword){

    showMessage(
      "New passwords do not match."
    );

    return;
  }


  if(!forgotConfirmationResult){

    showMessage(
      "Please request OTP first."
    );

    return;
  }


  try{

    showMessage(
      "Verifying OTP...",
      "success"
    );


    const result =
      await forgotConfirmationResult.confirm(otp);


    /*
      OTP authentication gives us
      authenticated access to the
      phone account.

      Password reset is then performed
      on the authenticated account.
    */

    await updatePassword(
      result.user,
      newPassword
    );


    await signOut(auth);


    alert(
      "✅ Password changed successfully. Please login with your new password."
    );


    document.getElementById("forgotOtpBox")
      .classList.remove("show");


    document.getElementById("forgotPhone")
      .value = "";

    document.getElementById("forgotOtp")
      .value = "";

    document.getElementById("newPassword")
      .value = "";

    document.getElementById("confirmNewPassword")
      .value = "";


    showSection("login");


  }catch(error){

    console.error(error);

    showMessage(
      firebaseError(error)
    );

  }

};


/* ==========================================
   TIMER
========================================== */

function startTimer(elementId,seconds){

  const element =
    document.getElementById(elementId);

  if(!element) return;


  clearInterval(
    elementId === "signupTimer"
      ? signupTimerInterval
      : forgotTimerInterval
  );


  let remaining = seconds;


  element.textContent =
    "Resend OTP available in " +
    remaining +
    " seconds";


  const interval =
    setInterval(function(){

      remaining--;

      if(remaining <= 0){

        clearInterval(interval);

        element.textContent =
          "You can request a new OTP.";

        return;
      }


      element.textContent =
        "Resend OTP available in " +
        remaining +
        " seconds";

    },1000);


  if(elementId === "signupTimer")
    signupTimerInterval = interval;

  else
    forgotTimerInterval = interval;

}


/* ==========================================
   FIREBASE ERROR TRANSLATION
========================================== */

function firebaseError(error){

  switch(error.code){

    case "auth/email-already-in-use":
      return "This email is already registered. Please login.";

    case "auth/invalid-email":
      return "Please enter a valid email address.";

    case "auth/weak-password":
      return "Password is too weak.";

    case "auth/invalid-credential":
      return "Wrong mobile/email or password.";

    case "auth/wrong-password":
      return "Wrong password.";

    case "auth/user-not-found":
      return "Account not found.";

    case "auth/invalid-verification-code":
      return "Incorrect OTP.";

    case "auth/code-expired":
      return "OTP has expired. Please request a new OTP.";

    case "auth/too-many-requests":
      return "Too many attempts. Please try again later.";

    case "auth/quota-exceeded":
      return "SMS limit reached. Please try again later.";

    case "auth/network-request-failed":
      return "Internet connection problem.";

    case "auth/requires-recent-login":
      return "Please login again before changing your password.";

    default:
      return error.message ||
        "Something went wrong. Please try again.";

  }

}
